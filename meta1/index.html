*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,Segoe UI,sans-serif}
.font-display{font-family:'Fraunces',Georgia,serif}
::selection{background:var(--coral);color:white}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.is-visible{opacity:1;transform:none}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blob1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-18px) scale(1.08)}}
@keyframes blob2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-24px,20px) scale(.94)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes marqueeRev{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes growLine{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.animate-floaty{animation:floaty 5s ease-in-out infinite}
.blob-a{animation:blob1 9s ease-in-out infinite}
.blob-b{animation:blob2 11s ease-in-out infinite}
.marquee-track{display:flex;width:max-content;animation:marquee 32s linear infinite}
.marquee-rev .marquee-track{animation:marqueeRev 36s linear infinite}
.marquee-wrap:hover .marquee-track{animation-play-state:paused}
.typing-dot{width:7px;height:7px;border-radius:999px;background:var(--violet);display:inline-block;animation:typing 1s infinite}
.typing-dot:nth-child(2){animation-delay:.15s}.typing-dot:nth-child(3){animation-delay:.3s}
.caret::after{content:"";display:inline-block;width:2px;height:1em;background:var(--coral);margin-left:3px;vertical-align:-2px;animation:caret 1s infinite}
.tilt{transition:transform .25s ease,box-shadow .25s ease;transform-style:preserve-3d;will-change:transform}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
