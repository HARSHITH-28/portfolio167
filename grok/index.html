type Variant = "onInk" | "onPaper";

function lerpPose(from: Pt[], to: Pt[], t: number): Pt[] {
  return from.map((point, index) => {
    const target = to[index] ?? point;
    return [point[0] + (target[0] - point[0]) * t, point[1] + (target[1] - point[1]) * t];
  });
}

function breathePose(pose: Pt[], amount: number): Pt[] {
  const wrist = pose[0] ?? [50, 70];
  return pose.map((point, index) => {
    if (index === 0) return point;
    return [wrist[0] + (point[0] - wrist[0]) * amount, wrist[1] + (point[1] - wrist[1]) * amount];
  });
}

const TIPS = new Set([4, 8, 12, 16, 20]);

function HandCanvas({
  pose,
  breathe = false,
  variant = "onInk",
  className,
}: {
  pose: Pt[];
  breathe?: boolean;
  variant?: Variant;
  className?: string;
}) {
  const svgRef = useRef<SVGSVGElement>(null);
  const poseRef = useRef(pose);
  poseRef.current = pose;

  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return;
    const lines = Array.from(svg.querySelectorAll("line"));
    const dots = Array.from(svg.querySelectorAll("circle"));
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let frame = 0;
    let visible = true;
    let current = poseRef.current.map((point) => [...point] as Pt);

    const paint = (time: number) => {
      const target = poseRef.current;
      current = reduce ? target.map((point) => [...point] as Pt) : lerpPose(current, target, 0.16);
      const drawn = breathe && !reduce ? breathePose(current, 0.94 + Math.sin(time / 900) * 0.06) : current;

      lines.forEach((line, index) => {
        const edge = HAND_EDGES[index];
        if (!edge) return;
        const a = drawn[edge[0]];
        const b = drawn[edge[1]];
        if (!a || !b) return;
        line.setAttribute("x1", String(a[0]));
        line.setAttribute("y1", String(a[1]));
        line.setAttribute("x2", String(b[0]));
        line.setAttribute("y2", String(b[1]));
      });
      dots.forEach((dot, index) => {
        const point = drawn[index];
        if (!point) return;
        dot.setAttribute("cx", String(point[0]));
        dot.setAttribute("cy", String(point[1]));
      });

      if (visible && !reduce) frame = requestAnimationFrame(paint);
    };

    frame = requestAnimationFrame(paint);
    const observer = new IntersectionObserver(([entry]) => {
      visible = entry?.isIntersecting ?? true;
      if (visible && !reduce) {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(paint);
      }
    });
    observer.observe(svg);

    return () => {
      cancelAnimationFrame(frame);
      observer.disconnect();
    };
  }, [breathe]);

  const lineClass = variant === "onInk" ? "stroke-paper/70" : "stroke-ink/50";
  const dotClass = variant === "onInk" ? "fill-paper" : "fill-ink";

  return (
    <svg
      ref={svgRef}
      viewBox="8 0 84 100"
      className={cn("h-full w-full", className)}
      aria-hidden="true"
    >
      {HAND_EDGES.map((edge, index) => {
        const a = pose[edge[0]] ?? [0, 0];
        const b = pose[edge[1]] ?? [0, 0];
        return (
          <line
            key={index}
            x1={a[0]}
            y1={a[1]}
            x2={b[0]}
            y2={b[1]}
            className={lineClass}
            strokeWidth="1.1"
            strokeLinecap="round"
          />
        );
      })}
      {pose.map((point, index) => (
        <circle
          key={index}
          cx={point[0]}
          cy={point[1]}
          r={index === 0 ? 2.1 : TIPS.has(index) ? 1.7 : 1.25}
          className={TIPS.has(index) ? "fill-lacquer" : dotClass}
        />
      ))}
    </svg>
  );
}

function Progress() {
  const bar = useRef<HTMLSpanElement>(null);

  useEffect(() => {
    const node = bar.current;
    if (!node) return;
    let frame = 0;
    const paint = () => {
      const root = document.documentElement;
      const max = root.scrollHeight - root.clientHeight;
      const progress = max > 0 ? root.scrollTop / max : 0;
      node.style.transform = `scaleX(${progress})`;
    };
    const onScroll = () => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(paint);
    };
    paint();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      cancelAnimationFrame(frame);
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);

  return (
    <span className="pointer-events-none fixed inset-x-0 top-0 z-50 h-0.5" aria-hidden>
      <span ref={bar} className="block h-full origin-left scale-x-0 bg-lacquer" />
    </span>
  );
}

function Nav() {
  const [open, setOpen] = useState(false);

  useEffect(() => {
    if (!open) return;
    const onKey = (event: KeyboardEvent) => {
      if (event.key === "Escape") setOpen(false);
    };
    const previous = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = previous;
      window.removeEventListener("keydown", onKey);
    };
  }, [open]);

  return (
    <header className="fixed inset-x-0 top-0 z-40 border-b border-paper/10 bg-ink/90 text-paper backdrop-blur-md">

              <h3 className="font-display text-2xl">{item.title}</h3>
              <p className="mt-2 text-sm text-muted">{item.detail}</p>
            </Reveal>
          ))}
        </div>
      </div>
    </section>
  );
}

function Contact() {
  const [note, setNote] = useState("");

  function onSubmit(event: FormEvent<HTMLFormElement>) {
    event.preventDefault();
    const data = new FormData(event.currentTarget);
    const name = String(data.get("name") ?? "").trim();
    const email = String(data.get("email") ?? "").trim();
    const message = String(data.get("message") ?? "").trim();
    const subject = encodeURIComponent(`Note from ${name}`);
    const body = encodeURIComponent(`${message}\n\n— ${name}\n${email}`);
    window.location.href = `mailto:${profile.email}?subject=${subject}&body=${body}`;
    setNote("Your mail app should open with the note filled in. If it doesn’t, use the address below.");
  }

  return (
    <section id="contact" className="scroll-mt-20 bg-ink py-20 text-paper md:py-28">
      <div className="mx-auto grid max-w-6xl gap-12 px-5 md:px-8 lg:grid-cols-12">
        <div className="lg:col-span-5">
          <p className="text-xs tracking-widest text-lacquer uppercase">A note</p>
          <h2 className="mt-3 text-4xl sm:text-5xl">Send a note.</h2>
          <p className="mt-4 text-paper/75">
            Internships, a project, or a question about the work. I read English, Kannada, Hindi, and German —
            write in whichever is easiest.
          </p>
          <ul className="mt-8 grid gap-3 text-sm">
            <li>
              <a className="nav-link" href={`mailto:${profile.email}`}>
                {profile.email}
              </a>
            </li>
            <li>
              <a className="nav-link text-paper/70" href={`mailto:${profile.collegeEmail}`}>
                {profile.collegeEmail}
              </a>
            </li>
            <li>
              <a className="nav-link" href={profile.phoneHref}>
                {profile.phoneDisplay}
              </a>
            </li>
            <li>
              <a className="nav-link" href={profile.whatsapp} target="_blank" rel="noreferrer">
                WhatsApp
              </a>
            </li>
            <li>
              <a className="nav-link" href={profile.linkedin} target="_blank" rel="noreferrer">
                LinkedIn
              </a>
            </li>
            <li>
              <OutLink href={profile.github} placeholder={profile.githubPlaceholder}>
                GitHub
              </OutLink>
            </li>
          </ul>
          <p className="mt-8 text-sm text-paper/55">
            {profile.interests.join(" · ")} · {profile.location}
          </p>
        </div>
        <form onSubmit={onSubmit} className="grid gap-6 lg:col-span-7">
          <label className="grid gap-2 text-sm">
            Name
            <input
              name="name"
              required
              autoComplete="name"
              className="h-12 border-b border-paper/25 bg-transparent text-paper outline-none focus:border-lacquer"
            />
          </label>
          <label className="grid gap-2 text-sm">
            Email
            <input
              name="email"
              type="email"
              required
              autoComplete="email"
              className="h-12 border-b border-paper/25 bg-transparent text-paper outline-none focus:border-lacquer"
            />
          </label>
          <label className="grid gap-2 text-sm">
            Message
            <textarea
              name="message"
              required
              rows={5}
              className="border-b border-paper/25 bg-transparent py-3 text-paper outline-none focus:border-lacquer"
            />
          </label>
          <div className="flex flex-wrap items-center gap-4">
            <button type="submit" className={buttonVariants({ tone: "lacquer" })}>
              Send the note
            </button>
            {note ? (
              <p className="text-sm text-paper/75" role="status">
                {note}
              </p>
            ) : null}
          </div>
        </form>
      </div>
    </section>
  );
}
