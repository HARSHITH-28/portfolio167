*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,Segoe UI,sans-serif}
.font-display{font-family:'Fraunces',Georgia,serif}
::selection{background:var(--amber);color:#18201C}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--forest);outline-offset:2px;border-radius:8px}
.reveal{opacity:0;transform:translateY(22px) scale(.985);transition:opacity .72s cubic-bezier(.16,1,.3,1),transform .72s cubic-bezier(.16,1,.3,1)}
.reveal.is-visible{opacity:1;transform:none}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blob1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-18px) scale(1.08)}}
@keyframes blob2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-24px,20px) scale(.94)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes marqueeRev{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes metaPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}
.animate-floaty{animation:floaty 5s ease-in-out infinite}
.animate-spin-slow{animation:spinSlow 18s linear infinite}
.blob-a{animation:blob1 9s ease-in-out infinite}
.blob-b{animation:blob2 11s ease-in-out infinite}
.marquee-track{display:flex;width:max-content;animation:marquee 32s linear infinite}
.marquee-rev .marquee-track{animation:marqueeRev 36s linear infinite}
.marquee-wrap:hover .marquee-track{animation-play-state:paused}
.typing-dot{width:7px;height:7px;border-radius:999px;background:var(--forest);display:inline-block;animation:typing 1s infinite}
.typing-dot:nth-child(2){animation-delay:.15s}.typing-dot:nth-child(3){animation-delay:.3s}
.caret::after{content:"";display:inline-block;width:2px;height:1em;background:var(--amber);margin-left:3px;vertical-align:-2px;animation:caret 1s infinite}
.tilt{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease;transform-style:preserve-3d;will-change:transform}
a[class*="rounded-full"],button[class*="rounded-full"]{position:relative;overflow:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease,background-color .2s ease,border-color .2s ease}
a[class*="rounded-full"]:active,button[class*="rounded-full"]:active{transform:scale(.975)}
a[href*="retailpulse"] span.rounded-full,a[href*="mood-sync"] span.rounded-full{animation:metaPulse 1.8s ease-in-out infinite}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}
